<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Application - Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/applications}">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/applications}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/applications/new}">New Job Application</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>
<!-- Navigation End -->

<!-- Content -->
<div class="container mt-3">
    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <form action="#" th:action="${jobApplicationDto.id != null} ? @{/applications/edit/{id}(id=${jobApplicationDto.id})} : @{/applications/new}" th:object="${jobApplicationDto}" method="post">
                        <input type="hidden" th:field="*{id}">


                        <div class="mb-3">
                            <label for="companyName" class="form-label">Company name</label>
                            <input type="text" class="form-control" id="companyName" th:field="*{companyName}">
                        </div>
                        <div class="mb-3">
                            <label for="jobTitle" class="form-label">Job title</label>
                            <input type="text" class="form-control" id="jobTitle" th:field="*{jobTitle}">
                        </div>
                        <div class="mb-3">
                            <label for="jobApplicationSource" class="form-label">Job application source</label>
                            <input type="text" class="form-control" id="jobApplicationSource" th:field="*{applicationSource}">
                        </div>
                        <div class="mb-3">
                            <label for="jobApplicationUrl" class="form-label">Job application url</label>
                            <input type="url" class="form-control" id="jobApplicationUrl" th:field="*{applicationUrl}">
                        </div>
                        <!-- Application date -->
                        <div class="mb-3">
                            <label for="jobApplicationDate" class="form-label">Job application date</label>
                            <input type="date" class="form-control" id="jobApplicationDate" th:field="*{applicationDate}">
                        </div>
                        <!-- Due Date -->
                        <div class="mb-3">
                            <label for="jobApplicationDeadline" class="form-label">Job application deadline</label>
                            <input type="date" class="form-control" id="jobApplicationDeadline" th:field="*{applicationDeadline}">
                        </div>
                        <div class="mb-3">
                            <label for="jobDescription" class="form-label">Job Description</label>
                            <textarea type="text" class="form-control" id="jobDescription" rows="8" th:field="*{jobDescription}"></textarea>
                        </div>

                        <a th:href="@{/applications}" class="btn btn-primary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Content End -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
