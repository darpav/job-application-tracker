<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .card-subtitle {
            font-size: 0.95rem;
            color: #6c757d;
        }
        .action-icons a {
            color: #495057;
            text-decoration: none;
            margin-left: 10px;
        }
        .action-icons a:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>
<!-- Navigation Fragment-->
<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

<!-- Content -->
<div class="container mt-3">
    <div class="row mt-3">
        <div class="col">
            <a th:href="@{/applications/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i> New Job Application</a>
        </div>
    </div>

    <!-- Cards -->
    <div class="row">
        <div class="col-md-3 mt-3" th:each="jobApplicationDto : ${jobApplicationsDto}">
            <div class="card h-100 p-3">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="card-title" th:text="${jobApplicationDto.jobTitle}">Job Title</h5>
                        <h6 class="card-subtitle mb-2" th:text="${jobApplicationDto.companyName}">Company Name</h6><h6></h6>
                        <p class="mb-1"><a th:href="${jobApplicationDto.companyUrl}" th:text="${jobApplicationDto.companyUrl}" target="_blank">Company Website</a></p>
                        <p class="mb-1"><strong>Applied:</strong> <span th:text="${jobApplicationDto.jobApplicationDate}">Date</span></p>
                        <p class="mb-1"><strong>Deadline:</strong> <span th:text="${jobApplicationDto.jobApplicationDeadline}">Deadline</span></p>
                        <p class="mt-3 mb-0"><strong>Description:</strong></p>
                        <p th:text="${jobApplicationDto.jobShortDescription}">Brief description of the job...</p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <a th:href="@{/applications/{id}(id=${jobApplicationDto.id})}" class="btn btn-outline-primary btn-sm">Details</a>
                        <div class="action-icons">
                            <a th:href="@{/applications/edit/{id}(id=${jobApplicationDto.id})}" title="Edit"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/applications/delete/{id}(id=${jobApplicationDto.id})}" title="Delete"><i class="bi bi-trash"></i></a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <!-- Cards End -->
</div>
<!-- Content End -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
