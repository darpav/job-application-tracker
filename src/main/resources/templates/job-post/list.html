<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jobs To Apply</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

    <div class="container mt-3">
        <div class="row mt-3">
            <div class="col">
                <a th:href="@{/job-posts/new}" type="button" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>New Job Post</a>
            </div>
        </div>

        <!-- Card -->
        <div class="row mt-3">
            <div class="col-md-4 mt-3" th:each="jobPostDto : ${jobPostsDto}">
                <div class="card h-100 p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="row">
                            <p class="card-title mb-1" th:text="${jobPostDto.jobTitle}">Job Title</p>
                        </div>
                        <div class="row">
                            <p class="company-name mb-0" th:text="${jobPostDto.companyName}">Company Name</p>
                        </div>
                        <div class="row">
                            <p class="mb-2 text-muted">
                                Deadline:
                                <span th:text="${jobPostDto.jobApplicationDeadline}">2025-12-31</span>
                            </p>
                        </div>

                        <div class="mt-auto">

                        <div class="row d-flex justify-content-between align-items-center">
                            <div class="col">
                                <a th:href="${jobPostDto.jobApplicationUrl}" class="btn btn-outline-primary btn-sm" target="_blank">url</a>
                            </div>
                            <div class="col-auto">
                                <div class="action-icons d-flex gap-2">
                                    <a th:href="@{/job-posts/edit/{id}(id=${jobPostDto.id})}" title="Edit"><i class="bi bi-pencil-square"></i></a>
                                    <a th:href="@{/job-posts/delete/{id}(id=${jobPostDto.id})}" title="Delete"><i class="bi bi-trash"></i></a>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Fragment-->
    <div th:fragment="footer">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

</body>
</html>
