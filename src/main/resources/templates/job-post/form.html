<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
    <!-- Navigation fragment -->
    <div th:fragment="navigation">
        <div th:replace="~{fragments/navigation :: navigation}"></div>
    </div>

    <!-- Form for create and edit -->
    <div class="container mt-3">
        <div class="row mt-3">
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <h3>New Job To Apply</h3>
                        </div>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="${jobPostDto.id != null} ? @{/job-posts/edit/{id}(id=${jobPostDto.id})} : @{/job-posts/new}" th:object="${jobPostDto}" method="post">
                            <input type="hidden" th:field="*{id}">
                            <!-- Job Title -->
                            <div class="row">
                                <div class="col">
                                    <div class="mb-3">
                                        <label for="jobTitle" class="form-label">Job title</label>
                                        <input type="text" class="form-control" id="jobTitle" th:field="*{jobTitle}">
                                    </div>
                                </div>
                            </div>
                            <!-- Company Name -->
                            <div class="row">
                                <div class="col">
                                    <div class="mb-3">
                                        <label for="companyName" class="form-label">Company Name</label>
                                        <input type="text" class="form-control" id="companyName" th:field="*{companyName}">
                                    </div>
                                </div>
                            </div>
                            <!-- Job Application Post Url -->
                            <div class="row">
                                <div class="col">
                                    <div class="mb-3">
                                        <label for="jobApplicationPostUrl" class="form-label">Job application post url</label>
                                        <input type="url" class="form-control" id="jobApplicationPostUrl" th:field="*{jobApplicationUrl}">
                                    </div>
                                </div>
                            </div>
                            <!-- Job Application Deadline -->
                            <div class="row">
                                <div class="col">
                                    <div class="mb-3">
                                        <label for="jobApplicationDeadline" class="form-label">Job application deadline</label>
                                        <input type="date" class="form-control" id="jobApplicationDeadline" th:field="*{jobApplicationDeadline}">
                                    </div>
                                </div>
                            </div>
                            <!-- Alert -->
                            <div class="row">
                                <div class="col">
                                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                        <span th:text="${errorMessage}">Error Message</span><br>
                                    </div>

                                </div>
                            </div>

                            <!-- Buttons -->
                            <a th:href="@{/job-posts}" class="btn btn-primary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
