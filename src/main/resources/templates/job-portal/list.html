<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker - My Job Portals</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Navigation Fragment -->
<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

<!-- Content -->
<div class="container mt-3 vh-100 d-flex flex-column">
    <div class="row mt-3">
        <div class="col">
            <a th:href="@{/job-portals/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>Add New Job Portal</a>
        </div>
    </div>

    <!-- Card would be better -->

    <!-- Table -->
    <div class="row mt-3 flex-grow-1">
        <div class="col">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Link</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="jobPortalDto : ${jobPortalsDto}">
                        <td th:text="${jobPortalDto.name}">Name</td>
                        <td>
                            <a th:href="${jobPortalDto.url}" th:text="${jobPortalDto.url}" target="_blank">Link</a>
                        </td>
                        <td>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="action-icons">
                                    <a th:href="@{/job-portals/edit/{id}(id=${jobPortalDto.id})}" title="Edit">
                                        <i class="bi bi-pencil-square"></i></a>
                                    <a th:href="@{/job-portals/delete/{id}(id=${jobPortalDto.id})}" title="Delete">
                                        <i class="bi bi-trash"></i></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Footer Fragment-->
<div th:fragment="footer">
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

</body>
</html>
