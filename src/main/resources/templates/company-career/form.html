<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker - Company Career Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
<!-- Navigation Fragment -->
<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

<div class="container mt-3">
    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <div class="row">
                        <h3>New Company Career</h3>
                    </div>
                </div>
                <div class="card-body">
                    <form action="#" th:action="${companyCareerDto.id != null} ? @{/company-careers/edit/{id}(id=${companyCareerDto.id})} : @{/company-careers/new}" th:object="${companyCareerDto}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <!-- Company name -->
                        <div class="row">
                            <div class="col">
                                <div class="mb-3">
                                    <label for="companyName" class="form-label">Company Name</label>
                                    <input type="text" class="form-control" id="companyName" th:field="*{name}">
                                </div>
                            </div>
                        </div>
                        <!-- Company url -->
                        <div class="row">
                            <div class="col">
                                <div class="mb-3">
                                    <label for="companyUrl" class="form-label">Company URL</label>
                                    <input type="url" class="form-control" id="companyUrl" th:field="*{url}"></label>
                                </div>
                            </div>
                        </div>
                        <!-- Company careers url -->
                        <div class="row">
                            <div class="col">
                                <div class="mb-3">
                                    <label for="companyCareerUrl" class="form-label">Careers URL</label>
                                    <input type="url" class="form-control" id="companyCareerUrl" th:field="*{careerUrl}"></label>
                                </div>
                            </div>
                        </div>
                        <!-- Alert -->
                        <div class="row">
                            <div class="col">
                                <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                                    <span th:text="${errorMessage}">Error Message</span><br>
                                </div>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <a th:href="@{/company-careers}" class="btn btn-primary">Cancel</a>
                        <button type="submit" class="btn btn-primary" th:text="${companyCareerDto.id != null} ? 'Update' : 'Save' ">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

</body>
</html>
