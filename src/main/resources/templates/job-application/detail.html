<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Application - Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .card-header {
            background-color: rgba(13, 110, 253, 0.5);
            color: white;
            border: 1px solid rgba(13, 110, 253, 0.2);
            border-radius: 8px;
            padding: 1rem;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #495057;
            margin-top: 1.25rem;
        }
        .data-label {
            font-weight: 500;
            color: #6c757d;
        }
        .back-button {
            margin-top: 2rem;
        }
    </style>

</head>
<body>
<!-- Navigation Fragment-->
<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

<!-- Content -->
<div class="container">
    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h4>Job Application Detail</h4>
                </div>
                <div class="card-body">
                    <!-- Company Name & Job Info -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="section-title">Company</div>
                            <p><span class="data-label">Name:</span> <span th:text="${jobApplicationDto.companyName}">Company Name</span></p>
                            <p><span class="data-label">Website:</span> <a th:href="${jobApplicationDto.companyUrl}" th:text="${jobApplicationDto.companyUrl}" target="_blank">Company URL</a></p>
                        </div>
                        <div class="col-md-6">
                            <div class="section-title">Job</div>
                            <p><span class="data-label">Title:</span> <span th:text="${jobApplicationDto.jobTitle}">Job Title</span></p>
                            <p><span class="data-label">Apply URL:</span> <a th:href="${jobApplicationDto.jobApplicationUrl}" th:text="${jobApplicationDto.jobApplicationUrl}" target="_blank">Application URL</a></p>
                        </div>
                    </div>

                    <!-- Descriptions -->
                    <div class="mb-3">
                        <div class="section-title">Job Description</div>
                        <p th:text="${jobApplicationDto.jobDescription}">Detailed job description...</p>
                    </div>

                    <div class="mb-3">
                        <div class="section-title">Skills Required</div>
                        <p th:text="${jobApplicationDto.jobSkills}">Skills list...</p>
                    </div>

                    <!-- Status -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="section-title">Info</div>
                            <p><span class="data-label">Confirmation Mail Received:</span>
                                <span th:text="${jobApplicationDto.confirmationMailReceived}">Yes/No</span></p>
                            <p><span class="data-label">Status</span>
                                <span th:text="${jobApplicationDto.status}">ACTIVE</span></p>
                            <p><span class="data-label">Status</span>
                                <span th:text="${jobApplicationDto.jobApplicationStage}">NONE</span></p>
                        </div>
                    </div>

                    <!-- Back Button -->
                    <div class="back-button">
                        <a class="btn btn-outline-primary" th:href="@{/job-applications}">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Content End -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
