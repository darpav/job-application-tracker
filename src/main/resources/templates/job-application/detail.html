<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Jobs - Detail</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<!-- Navigation Fragment-->
<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

<!-- Content -->
<div class="container mt-3" style="height: 100vh">
    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h4>Job Application Detail</h4>
                </div>
                <div class="card-body">
                    <!-- Company Name & Job Info -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="card-title">Company</div>
                            <p class="mb-0"><span>Name:</span> <span th:text="${jobApplicationDto.companyName}">Company Name</span></p>
                            <p class="mb-0"><span>Website:</span> <a th:href="${jobApplicationDto.companyUrl}" th:text="${jobApplicationDto.companyUrl}" target="_blank">Company URL</a></p>
                        </div>
                        <div class="col-md-6">
                            <div class="card-title">Job</div>
                            <p class="mb-0"><span>Title:</span> <span th:text="${jobApplicationDto.jobTitle}">Job Title</span></p>
                            <p class="mb-0"><span>Apply URL:</span> <a th:href="${jobApplicationDto.jobApplicationUrl}" th:text="${jobApplicationDto.jobApplicationUrl}" target="_blank">Application URL</a></p>
                        </div>
                    </div>

                    <!-- Descriptions -->
                    <div class="mb-3">
                        <div class="card-title">Job Description</div>
                        <p class="mb-0" th:text="${jobApplicationDto.jobDescription}">Detailed job description...</p>
                    </div>

                    <div class="mb-3">
                        <div class="card-title">Skills Required</div>
                        <p class="mb-0" th:text="${jobApplicationDto.jobSkills}">Skills list...</p>
                    </div>

                    <!-- Status -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="card-title">Info</div>
                            <p class="mb-0"><span>Confirmation Mail Received:</span>
                                <span th:text="${jobApplicationDto.confirmationMailReceived}">Yes/No</span></p>
                            <p class="mb-0"><span>Status</span>
                                <span th:text="${jobApplicationDto.status}">ACTIVE</span></p>
                            <p class="mb-0"><span>Status</span>
                                <span th:text="${jobApplicationDto.jobApplicationStage}">NONE</span></p>
                        </div>
                    </div>

                    <!-- Back Button -->
                    <div class="back-button">
                        <a class="btn btn-outline-primary" th:href="@{/job-applications}">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Content End -->

    <!-- Footer Fragment-->
    <div th:fragment="footer">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
