<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Application - Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<!-- Navigation Fragment -->
<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

<!-- Content -->
<div class="container mt-3" style="height: 100vh">
    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <div class="row">
                        <h4>New Job Application</h4>
                    </div>
                </div>
                <div class="card-body">
                    <form action="#" th:action="${jobApplicationDto.id != null} ? @{/job-applications/edit/{id}(id=${jobApplicationDto.id})} : @{/job-applications/new}" th:object="${jobApplicationDto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <!-- Job title -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="jobTitle" class="form-label">Job title</label>
                                    <input type="text" class="form-control" id="jobTitle" th:field="*{jobTitle}">
                                </div>
                            </div>
                            <!-- Job url for duplicated records -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="jobApplicationUrl" class="form-label">Job application url</label>
                                    <input type="url" class="form-control" id="jobApplicationUrl" th:field="*{jobApplicationUrl}">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Company name -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="companyName" class="form-label">Company name</label>
                                    <input type="text" class="form-control" id="companyName" th:field="*{companyName}">
                                </div>
                            </div>
                            <!-- Company url -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="companyUrl" class="form-label">Company url</label>
                                    <input type="url" class="form-control" id="companyUrl" th:field="*{companyUrl}">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <!-- Job application date -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="jobApplicationDate" class="form-label">Job application date</label>
                                    <input type="date" class="form-control" id="jobApplicationDate" th:field="*{jobApplicationDate}">
                                </div>
                            </div>
                            <!-- Job application deadline -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="jobApplicationDeadline" class="form-label">Job application deadline</label>
                                    <input type="date" class="form-control" id="jobApplicationDeadline" th:field="*{jobApplicationDeadline}">
                                </div>
                            </div>
                        </div>

                        <!-- Job description -->
                        <div class="mb-3">
                            <label for="jobDescription" class="form-label">Job Description</label>
                            <textarea type="text" class="form-control" id="jobDescription" rows="5" th:field="*{jobDescription}"></textarea>
                        </div>

                        <!-- Job skills -->
                        <div class="mb-3">
                            <label for="jobSkills" class="form-label">Skills</label>
                            <textarea type="text" class="form-control" id="jobSkills" rows="5" th:field="*{jobSkills}"></textarea>
                        </div>

                        <div class="row">
                            <!-- Confirmation Mail Received -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="confirmationMailReceived" class="form-label">Confirmation mail received Yes/No</label>
                                    <input type="text" class="form-control" id="confirmationMailReceived" th:field="*{confirmationMailReceived}">
                                </div>
                            </div>

                            <!-- Status -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="statusSelected" class="form-label">Status Active/Inactive</label>
                                    <select class="form-select" id="statusSelected" th:field="*{status}">
                                        <option th:each="statusOption : ${statusOptions}" th:text="${statusOption}" th:value="${statusOption}" value="">ACTIVE</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Job Application Stage -->
                            <div class="col">
                                <div class="mb-3">
                                    <label for="jobApplicationStage" class="form-label">Application Stage</label>
                                    <select class="form-select" id="jobApplicationStage" th:field="*{jobApplicationStage}">
                                        <option th:each="stageOption : ${stageOptions}" th:text="${stageOption}" th:value="${stageOption}" value="">NONE</option>
                                    </select>
                                </div>
                            </div>

                        </div>


                        <a th:href="@{/job-applications}" class="btn btn-primary">Cancel</a>
                        <button type="submit" class="btn btn-primary" th:text="${jobApplicationDto.id != null} ? 'Update' : 'Save' ">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Content End -->

    <!-- Footer Fragment-->
    <div th:fragment="footer">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
