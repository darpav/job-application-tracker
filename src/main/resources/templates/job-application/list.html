<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Jobs</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Navigation Fragment-->
<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

<!-- Content -->
<div class="container mt-3">
    <div class="row mt-3">
        <div class="col">
            <a th:href="@{/job-applications/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i> New Job Application</a>
        </div>
    </div>

    <!-- Cards -->
    <div class="row mt-3">
        <div class="col-md-4 mt-3" th:each="jobApplicationDto : ${jobApplicationsDto}">
            <div class="card h-100 p-3">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <div class="row justify-content-between">
                            <div class="col">
                                <h5 class="card-title" th:text="${jobApplicationDto.jobTitle}">Job Title</h5>
                            </div>
                            <div class="col-auto">
<!--                                <span class="position-absolute top-0 end-0 m-2">-->
                                    <span class="status-circle" th:classappend="${jobApplicationDto.status.name() == 'INACTIVE' ? 'bg-danger' :
                                                                (jobApplicationDto.jobApplicationDeadline.isBefore(T(java.time.LocalDate).now()) ? 'bg-warning' : 'bg-success')}" th:title="${jobApplicationDto.status.name()}"></span> <!-- or bg-danger for Inactive -->
<!--                                </span>-->
                            </div>
                        </div>

                        <p class="company-name mb-0" th:text="${jobApplicationDto.companyName}">Company Name</p>
                        <a th:href="${jobApplicationDto.companyUrl}" th:text="${jobApplicationDto.companyUrl}" target="_blank" class="company-url text-decoration-none">Company Website</a>
                        <div class="dates mt-2">
                            <span><strong>Applied:</strong> <span th:text="${jobApplicationDto.jobApplicationDate}">Date</span></span></br>
                            <span><strong>Deadline:</strong> <span th:text="${jobApplicationDto.jobApplicationDeadline}">Deadline</span></span>
                        </div>

                        <p class="description mt-3" th:text="${jobApplicationDto.jobShortDescription}">Brief description of the job...</p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <a th:href="@{/job-applications/{id}(id=${jobApplicationDto.id})}" class="btn btn-outline-primary btn-sm">Details</a>
                        <div class="action-icons">
                            <a th:href="@{/job-applications/edit/{id}(id=${jobApplicationDto.id})}" title="Edit">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/job-applications/delete/{id}(id=${jobApplicationDto.id})}" title="Delete"><i class="bi bi-trash"></i></a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <!-- Cards End -->
</div>
<!-- Content End -->

<!-- Footer Fragment-->
<div th:fragment="footer">
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
