<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

    <!-- Navigation -->
    <div th:replace="~{fragments/navigation :: navigation}"></div>

    <!-- List of all job posts -->
    <div class="container mt-3">
        <div class="row mt-3">
            <div class="col">
                <a th:href="@{/posts/new}" type="button" class="btn btn-primary">New Job Post</a>
            </div>
        </div>

        <!-- Table -->
        <div class="row mt-3">
            <div class="col">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col">Job Title</th>
                            <th scope="col">Company</th>
                            <th scope="col">Deadline</th>
                            <th scope="col">Post Url</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="post : ${posts}">
                            <td th:text="${post.title}"></td>
                            <td th:text="${post.description}"></td>
                            <td th:text="${post.datePosted}"></td>
                            <td>
                                <a th:href="@{/posts/{id}/edit(id=${post.id})}" type="button" class="btn btn-primary"><i class="bi bi-pencil-square"></i></a>
                                <a th:href="@{/posts/{id}/delete(id=${post.id})}" type="button" class="btn btn-danger"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

</body>
</html>
