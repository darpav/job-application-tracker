<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 1rem;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .card-subtitle {
            font-size: 0.95rem;
            color: #6c757d;
        }
        .action-icons a {
            color: #495057;
            text-decoration: none;
            margin-left: 10px;
        }
        .action-icons a:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div th:fragment="navigation">
    <div th:replace="~{fragments/navigation :: navigation}"></div>
</div>

    <div class="container mt-3">
        <div class="row mt-3">
            <div class="col">
                <a th:href="@{/posts/new}" type="button" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>New Job Post</a>
            </div>
        </div>

        <!-- Card -->
        <div class="row">
            <div class="col-md-3 mt-3" th:each="jobPostDto : ${jobPostsDto}">
                <div class="card h-100 p-3">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${jobPostDto.jobTitle}">Job Title</h5>
                        <h6 class="card-subtitle mb-2" th:text="${jobPostDto.companyName}">Company Name</h6>
                        <p class="mb-2 text-muted">
                            Deadline:
                            <span th:text="${jobPostDto.jobApplicationDeadline}">2025-12-31</span>
                        </p>
                        <!-- Add URL -->
                        <a th:href="${jobPostDto.jobApplicationUrl}" th:text="${jobPostDto.jobApplicationUrl}" target="_blank">url</a>
                        <div class="action-icons">
                            <a th:href="@{/posts/edit/{id}(id=${jobPostDto.id})}" title="Edit"><i class="bi bi-pencil-square"></i></a>
                            <a th:href="@{/posts/delete/{id}(id=${jobPostDto.id})}" title="Delete"><i class="bi bi-trash"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

</body>
</html>
